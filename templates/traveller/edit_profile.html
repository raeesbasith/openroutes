{% include 'traveller/header.html' %}
{% load static %}

<style>
    /* Consistent styling with Profile/Password pages */
        .navbar {
        position: relative;
        background: var(--bs-primary) !important;
    }
    .navbar-nav .nav-link:hover {
        background: rgba(255, 255, 255, 0.15);
    }
    .edit-section {
        background-color: #f3f6f9;
        min-height: 85vh;
        padding: 50px 0;
        font-family: 'Jost', sans-serif;
    }

    .card-box {
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.05);
        border: none;
        overflow: hidden;
    }

    .card-header-custom {
        padding: 25px 30px;
        border-bottom: 1px solid #f1f2f6;
        background: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .card-title-custom {
        font-size: 1.5rem;
        font-weight: 700;
        color: #13357B;
        margin: 0;
    }

    .form-container {
        padding: 40px;
    }

    .input-group-text {
        background-color: #f8f9fa;
        border: 1px solid #dfe6e9;
        border-right: none;
        color: #13357B;
    }

    .form-control-custom {
        height: 50px;
        border-radius: 8px;
        border: 1px solid #dfe6e9;
        padding: 0 15px;
        font-size: 1rem;
        transition: all 0.3s;
    }

    .form-control-custom:focus {
        border-color: #23a6d5;
        box-shadow: 0 0 0 0.2rem rgba(35, 166, 213, 0.25);
    }
    
    .input-group .form-control-custom {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
    }

    .form-label {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 8px;
        font-size: 0.95rem;
    }

    .row-margin {
        margin-bottom: 25px;
    }

    .btn-submit {
        background-color: #13357B;
        color: white;
        border: none;
        padding: 12px 35px;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s;
        box-shadow: 0 4px 10px rgba(19, 53, 123, 0.2);
    }

    .btn-submit:hover {
        background-color: #0d2558;
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(19, 53, 123, 0.3);
        color: white;
    }

    .btn-cancel {
        background-color: white;
        color: #7f8c8d;
        border: 1px solid #dfe6e9;
        padding: 12px 35px;
        border-radius: 50px;
        font-weight: 600;
        margin-right: 15px;
        transition: all 0.3s;
    }

    .btn-cancel:hover {
        background-color: #f8f9fa;
        color: #2c3e50;
        text-decoration: none;
        border-color: #b2bec3;
    }
</style>

<div class="edit-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card-box">
                    <div class="card-header-custom">
                        <h3 class="card-title-custom"><i class="fas fa-user-edit me-2"></i> Edit Profile</h3>
                        <a href="{% url 'profile_view' %}" class="btn-close" aria-label="Close"></a>
                    </div>
                    
                    <div class="form-container">
                        <form method="POST" action="{% url 'edit_profile' %}">
                            {% csrf_token %}
                            
                            <!-- Personal Details Section -->
                            <h5 class="mb-4 text-muted border-bottom pb-2">Personal Information</h5>
                            
                            <div class="row row-margin">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                                        <input type="text" class="form-control form-control-custom" id="name" name="name" value="{{ traveller.traveller_name }}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                        <input type="email" class="form-control form-control-custom" id="email" name="email" value="{{ traveller.email }}" required>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row row-margin">
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-phone-alt"></i></span>
                                        <input type="tel" class="form-control form-control-custom" id="phone" name="phone" value="{{ traveller.phone }}" required pattern="[0-9]{10}" title="Ten digits code">
                                    </div>
                                </div>
                            </div>

                            <!-- Address Details Section -->
                            <h5 class="mb-4 text-muted border-bottom pb-2 mt-4">Address Details</h5>
                            
                            <div class="row row-margin">
                                <div class="col-12">
                                    <label for="address" class="form-label">Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                                        <textarea class="form-control form-control-custom" id="address" name="address" rows="1" style="height: auto; min-height: 50px; padding-top: 12px;" required>{{ traveller.address }}</textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="row row-margin">
                                <div class="col-md-4">
                                    <label for="city" class="form-label">City</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-city"></i></span>
                                        <input type="text" class="form-control form-control-custom" id="city" name="city" value="{{ traveller.city }}" required>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label for="district" class="form-label">District</label>
                                    <select class="form-select form-control-custom" id="district" name="district" required>
                                        <option value="" disabled>Select District</option>
                                        {% for district in districts %}
                                            <option value="{{ district.district_id }}" {% if traveller.district.district_id == district.district_id %}selected{% endif %}>
                                                {{ district.name }}
                                            </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="pincode" class="form-label">Pincode</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-map-pin"></i></span>
                                        <input type="text" class="form-control form-control-custom" id="pincode" name="pincode" value="{{ traveller.pincode }}" required pattern="[0-9]{6}" title="Six digits pincode">
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end mt-5">
                                <a href="{% url 'profile_view' %}" class="btn btn-cancel">Cancel</a>
                                <button type="submit" class="btn btn-submit"><i class="fas fa-save me-2"></i> Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'traveller/footer.html' %}
