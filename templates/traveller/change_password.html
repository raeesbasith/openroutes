{% include 'traveller/header.html' %}
{% load static %}

<style>
    /* Styling consistent with profile view */
    .navbar {
        position: relative;
        background: var(--bs-primary) !important;
    }
    .navbar-nav .nav-link:hover {
        background: rgba(255, 255, 255, 0.15);
    }
    .password-section {
        background-color: #f3f6f9;
        min-height: 85vh;
        padding: 50px 0;
        font-family: 'Jost', sans-serif;
    }

    .card-box {
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.05);
        border: none;
        overflow: hidden;
    }

    .card-header-custom {
        padding: 25px 30px;
        border-bottom: 1px solid #f1f2f6;
        background: #fff;
    }

    .card-title-custom {
        font-size: 1.5rem;
        font-weight: 700;
        color: #13357B;
        margin: 0;
    }

    .form-container {
        padding: 30px;
    }

    .form-label {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 8px;
    }

    .form-control-custom {
        height: 50px;
        border-radius: 8px;
        border: 1px solid #dfe6e9;
        padding: 0 15px;
        font-size: 1rem;
        transition: all 0.3s;
    }

    .form-control-custom:focus {
        border-color: #23a6d5;
        box-shadow: 0 0 0 0.2rem rgba(35, 166, 213, 0.25);
    }

    .btn-submit {
        background-color: #13357B;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s;
    }

    .btn-submit:hover {
        background-color: #0d2558;
        transform: translateY(-2px);
    }

    .btn-cancel {
        background-color: white;
        color: #7f8c8d;
        border: 1px solid #dfe6e9;
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: 600;
        margin-left: 10px;
        transition: all 0.3s;
    }

    .btn-cancel:hover {
        background-color: #f8f9fa;
        color: #2c3e50;
        text-decoration: none;
    }
</style>

<div class="password-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card-box">
                    <div class="card-header-custom">
                        <h3 class="card-title-custom"><i class="fas fa-key me-2"></i> Change Password</h3>
                    </div>
                    <div class="form-container">
                        <form method="POST" action="{% url 'change_password' %}">
                            {% csrf_token %}
                            
                            <!-- Current Password -->
                            <div class="mb-4">
                                <label for="current_password" class="form-label">Current Password</label>
                                <input type="password" class="form-control form-control-custom" id="current_password" name="current_password" required placeholder="Enter current password">
                            </div>

                            <!-- New Password -->
                            <div class="mb-4">
                                <label for="new_password" class="form-label">New Password</label>
                                <input type="password" class="form-control form-control-custom" id="new_password" name="new_password" required placeholder="Enter new password (min 8 chars)" minlength="8">
                            </div>

                            <!-- Confirm New Password -->
                            <div class="mb-4">
                                <label for="confirm_password" class="form-label">Confirm New Password</label>
                                <input type="password" class="form-control form-control-custom" id="confirm_password" name="confirm_password" required placeholder="Re-enter new password">
                            </div>

                            <div class="d-flex align-items-center mt-4">
                                <button type="submit" class="btn btn-submit">Update Password</button>
                                <a href="{% url 'profile_view' %}" class="btn btn-cancel">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'traveller/footer.html' %}
