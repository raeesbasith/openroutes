{% load static %}
{% include 'operator/header.html' %}

<style>
    :root {
      --primary: #0c2d57;
      --border: #e2e8f0;
      --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    body {
        background-color: #f8fafc;
    }

    .page-container {
        padding: 40px;
        max-width: 800px;
        margin: 0 auto;
    }

    .edit-card {
        background: #fff;
        border-radius: 16px;
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: var(--card-shadow);
        padding: 40px;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #1e293b;
    }

    .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 15px;
        transition: border-color 0.2s;
    }

    .form-control:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 3px rgba(12, 45, 87, 0.1);
    }
    
    .section-title {
        font-size: 18px;
        font-weight: 700;
        color: #334155;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
    }
    
    .btn-save {
        background-color: var(--primary);
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
        transition: background-color 0.2s;
    }
    
    .btn-save:hover {
        background-color: #081b37;
    }
    
    .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 16px;
        color: #64748b;
        text-decoration: none;
        font-size: 14px;
    }
    
    .password-section {
        background-color: #f8fafc;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid var(--border);
        margin-top: 30px;
    }
</style>

<div class="page-container">
    <div class="edit-card">
        <h2 style="margin-bottom: 30px; text-align: center; color: var(--primary);">Edit Profile</h2>
        
        <form method="POST" action="{% url 'profile_edit' %}">
            {% csrf_token %}
            
            <h3 class="section-title">Personal Information</h3>
            
            <div class="form-group">
                <label for="operator_name" class="form-label">Operator/Company Name</label>
                <input type="text" id="operator_name" name="operator_name" class="form-control" value="{{ operator.operator_name }}" required>
            </div>
            
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ operator.email }}" required>
            </div>
            
            <div class="form-group">
                <label for="contact" class="form-label">Phone Number</label>
                <input type="text" id="contact" name="contact" class="form-control" value="{{ operator.contact }}" required>
            </div>

            <div class="form-group">
                <label for="address" class="form-label">Address</label>
                <textarea id="address" name="address" class="form-control" rows="3" required>{{ operator.address }}</textarea>
            </div>

            <div class="form-group">
                <label for="district" class="form-label">District</label>
                <select id="district" name="district" class="form-control">
                    {% for district in districts %}
                    <option value="{{ district.district_id }}" {% if operator.district.district_id == district.district_id %}selected{% endif %}>
                        {{ district.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <button type="submit" class="btn-save" style="margin-top: 30px;">Save Changes</button>
            <div style="text-align: center; margin-top: 20px;">
                <a href="{% url 'change_password_operator' %}" style="color: var(--primary); text-decoration: none; font-weight: 500;">
                    <i class="bi bi-key"></i> Change Password
                </a>
            </div>
            <a href="{% url 'operator_profile' %}" class="btn-cancel">Cancel</a>
        </form>
    </div>
</div>

{% include 'operator/footer.html' %}
